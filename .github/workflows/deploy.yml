name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # avatar.glb is stored in Git LFS. Without this the checkout hands the
      # build a 132-byte pointer file, which deploys and 3D silently breaks.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Flips the repo's Pages source to GitHub Actions on the first run, so
      # this does not need doing by hand in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - run: npm run build

      # The router serves /myworks client-side; without this, reloading that
      # URL on Pages returns a 404 instead of the app.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
